<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet"></head><body>
<div class="login-wrap"><div class="card p-4" style="width:380px"><h4 class="mb-1"><i class="bi bi-shop text-primary"></i> Smart Inventory &amp; Billing</h4>
<p class="text-muted">Sign in to continue</p>
{% with m = get_flashed_messages(with_categories=true) %}{% for c,t in m %}<div class="alert alert-{{ c }}">{{ t }}</div>{% endfor %}{% endwith %}
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email</label><input type="email" name="email" class="form-control mb-3" required autofocus>
<label class="form-label">Password</label><input type="password" name="password" class="form-control mb-3" required>
<button class="btn btn-primary w-100">Sign in</button></form></div></div></body></html>
