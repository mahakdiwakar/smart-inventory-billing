{% extends 'base.html' %}{% block content %}<div class="card p-4"><h5>New purchase</h5><div class="row g-2 mb-3"><div class="col-md-4"><select id="sup" class="form-select"><option value="">Select supplier</option>{% for s in suppliers %}<option value="{{ s.supplier_id }}">{{ s.supplier_name }}</option>{% endfor %}</select></div>
<div class="col-md-3"><input type="date" id="dt" value="{{ today }}" class="form-control"></div><div class="col-md-3"><input id="sinv" class="form-control" placeholder="Supplier invoice no (optional)"></div></div>
<table class="table"><thead><tr><th>Product</th><th style="width:100px">Qty</th><th style="width:130px">Unit cost</th><th style="width:100px">GST %</th><th class="text-end">Line total</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<button class="btn btn-outline-primary btn-sm mb-3" onclick="addRow()">+ Add product</button>
<div class="text-end"><div>Subtotal <b id="st">0.00</b> &nbsp; GST <b id="gt">0.00</b> &nbsp; Total <b id="tt">0.00</b></div><div id="err" class="text-danger small"></div><button id="save" class="btn btn-primary mt-2">Save purchase</button></div></div>{% endblock %}
{% block scripts %}<script>const P={{ products|tojson }};let key=crypto.randomUUID(),busy=false;const $=id=>document.getElementById(id);
function addRow(){const tr=document.createElement('tr');tr.innerHTML=`<td><select class="form-select form-select-sm p"><option value="">Select</option>${P.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></td><td><input type="number" min="1" value="1" class="form-control form-control-sm q"></td><td><input type="number" step="0.01" class="form-control form-control-sm c"></td><td><input type="number" step="0.01" class="form-control form-control-sm g"></td><td class="text-end l">0.00</td><td><button class="btn btn-sm text-danger" onclick="this.closest('tr').remove();calc()">×</button></td>`;
tr.querySelector('.p').onchange=e=>{const p=P.find(x=>x.id==e.target.value);if(p){tr.querySelector('.c').value=p.cost;tr.querySelector('.g').value=p.gst}calc()};tr.querySelectorAll('input').forEach(i=>i.oninput=calc);$('rows').appendChild(tr)}
function rows(){return[...$('rows').children].map(t=>({product_id:t.querySelector('.p').value,quantity:+t.querySelector('.q').value,unit_cost:t.querySelector('.c').value,gst_rate:t.querySelector('.g').value,tr:t})).filter(r=>r.product_id)}
function calc(){let s=0,g=0;rows().forEach(r=>{const b=r.quantity*(+r.unit_cost||0),x=b*(+r.gst_rate||0)/100;s+=b;g+=x;r.tr.querySelector('.l').textContent=(b+x).toFixed(2)});$('st').textContent=s.toFixed(2);$('gt').textContent=g.toFixed(2);$('tt').textContent=(s+g).toFixed(2)}
$('save').onclick=async()=>{if(busy)return;busy=true;$('save').disabled=true;const r=await postJSON('/purchases/save',{idempotency_key:key,supplier_id:$('sup').value,date:$('dt').value,supplier_invoice_no:$('sinv').value,items:rows().map(({tr,...x})=>x)});
if(r.ok)location=r.url;else{$('err').textContent=r.error;busy=false;$('save').disabled=false}};addRow();</script>{% endblock %}
