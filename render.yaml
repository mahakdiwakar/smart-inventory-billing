services:
  - type: web
    name: smart-inventory-billing
    runtime: python
    rootDir: smart_inventory_billing
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app" --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: smart_inventory_billing
      - key: DB_SSL_REQUIRED
        value: "true"
      - key: ADMIN_EMAIL
        value: admin@smartstore.local
      - key: ADMIN_PASSWORD
        sync: false
